kind = "web"
previewPath = "/"
title = "Domino Gaplek Multiplayer"
version = "1.0.0"
id = "artifacts/gaplek"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 18417
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/gaplek run dev"

[services.env]
PORT = "18417"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/gaplek", "run", "build"]
publicDir = "artifacts/gaplek/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
